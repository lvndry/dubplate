name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run before it. Runs on main each get
# a group of their own, so none is cancelled.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Debug info bloats the cache without helping CI.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Clippy and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the system libraries the audio engine and the desktop app build against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libasound2-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- --deny warnings
      - name: Install cargo-nextest
        env:
          NEXTEST_VERSION: 0.9.152
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) asset=x86_64-unknown-linux-gnu ;;
            Linux-ARM64) asset=aarch64-unknown-linux-gnu ;;
            macOS-*) asset=universal-apple-darwin ;;
            *) echo "unsupported runner ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          curl -fsSL --retry 3 \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-${asset}.tar.gz" \
            | tar xz
          sudo install cargo-nextest /usr/local/bin/cargo-nextest
      # Tests run in parallel across every test binary, so a workspace run
      # takes a fraction of the sequential cargo test.
      - name: Tests
        run: cargo nextest run --workspace --locked
      # nextest does not run doctests, so keep them covered.
      - name: Doc tests
        run: cargo test --workspace --locked --doc
