[package]
name = "dubplate"
description = "Command line tool for Dubplate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
dubplate-library = { version = "0.1.0", path = "../../crates/dubplate-library" }
dubplate-midi = { version = "0.1.0", path = "../../crates/dubplate-midi" }
dubplate-prep = { version = "0.1.0", path = "../../crates/dubplate-prep" }
dubplate-rekordbox = { version = "0.1.0", path = "../../crates/dubplate-rekordbox" }
dubplate-usb = { version = "0.1.0", path = "../../crates/dubplate-usb" }
jiff = "1.0.2"
serde_json = "1.0.154"

[lints]
workspace = true
