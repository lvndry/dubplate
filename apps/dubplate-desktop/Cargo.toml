[package]
name = "dubplate-desktop"
description = "The Dubplate desktop app: two decks, a mixer and the rekordbox collection"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dubplate-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
dubplate-engine = { version = "0.1.0", path = "../../crates/dubplate-engine" }
dubplate-rekordbox = { version = "0.1.0", path = "../../crates/dubplate-rekordbox" }
gpui = { version = "=0.9.1", package = "gpui-kit" }
thiserror = "2.0.21"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSString", "NSBundle", "NSDictionary", "NSObject"] }

[build-dependencies]
resvg = "0.50.0"
