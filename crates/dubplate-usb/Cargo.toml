[package]
name = "dubplate-usb"
description = "Exports sets and playlists to USB sticks that CDJs and XDJs read as a rekordbox export"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dubplate-engine = { version = "0.1.0", path = "../dubplate-engine" }
dubplate-library = { version = "0.1.0", path = "../dubplate-library" }
dubplate-prep = { version = "0.1.0", path = "../dubplate-prep" }
dubplate-rekordbox = { version = "0.1.0", path = "../dubplate-rekordbox" }
jiff = "1.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
