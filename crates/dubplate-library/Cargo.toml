[package]
name = "dubplate-library"
description = "Dubplate's own music library: the folders a DJ chooses, scanned for tracks and their tags"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dirs = "7.0.0"
lofty = "0.25.5"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.2"

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "scan"
harness = false
