[package]
name = "dubplate-engine"
description = "Real-time audio engine that plays tracks on decks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cpal = "0.18.2"
dubplate-fx = { version = "0.1.0", path = "../dubplate-fx" }
rtrb = "0.4.1"
signalsmith-stretch = "0.1.3"
symphonia = { version = "0.6.1", features = ["aac", "alac", "flac", "mp3", "pcm", "isomp4", "aiff", "wav", "id3v2"] }
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8.2"
crossterm = "0.29.0"
libc = "0.2.191"
tempfile = "3.27.0"

[[bench]]
name = "render"
harness = false
