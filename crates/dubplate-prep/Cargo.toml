[package]
name = "dubplate-prep"
description = "Set preparation for Dubplate: sets, ready checks, seam plans and next-track suggestions"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dubplate-rekordbox = { version = "0.1.0", path = "../dubplate-rekordbox" }
euphoria-core = { git = "https://github.com/lvndry/euphoria", rev = "50492196c9347ab5b315ddbc2a5a544964436c4c", default-features = false, features = ["drone"] }
rusqlite.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
