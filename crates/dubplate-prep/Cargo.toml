[package]
name = "dubplate-prep"
description = "Set preparation for Dubplate: sets, ready checks, seam plans and next-track suggestions"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dirs = "7.0.0"
dubplate-library = { version = "0.1.0", path = "../dubplate-library" }
dubplate-rekordbox = { version = "0.1.0", path = "../dubplate-rekordbox" }
euphoria-core = { workspace = true, features = ["drone"] }
rusqlite.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
quick-xml = "0.42.0"
tempfile = "3.27.0"
