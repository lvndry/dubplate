[workspace]
resolver = "3"
members = [
  "crates/dubplate-rekordbox",
  "crates/dubplate-engine",
  "crates/dubplate-fx",
  "crates/dubplate-midi",
  "crates/dubplate-library",
  "crates/dubplate-prep",
  "apps/dubplate-cli",
  "apps/dubplate-desktop",
]

[workspace.dependencies]
rusqlite = { version = "0.42.0", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/lvndry/dubplate"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
# From clippy::pedantic, the lints that catch real mistakes rather than taste: integer casts
# that can silently wrap or lose bits, copies of large values and arrays that blow up the audio
# thread's stack, needless allocations, and `Result`s that can never be an error.
cast_lossless = "warn"
cast_possible_wrap = "warn"
checked_conversions = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
manual_let_else = "warn"
unnecessary_wraps = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = true

# For running the app while developing: optimised like a release, so audio and analysis run at
# full speed, but without link-time optimisation and built in parallel and incrementally, so a
# rebuild after a small change takes seconds. Releases keep `release`.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
