[workspace]
resolver = "3"
members = [
  "crates/dubplate-rekordbox",
  "crates/dubplate-engine",
  "crates/dubplate-fx",
  "crates/dubplate-midi",
  "crates/dubplate-library",
  "crates/dubplate-prep",
  "crates/dubplate-stems",
  "apps/dubplate-cli",
  "apps/dubplate-desktop",
]

[workspace.dependencies]
euphoria-core = { git = "https://github.com/lvndry/euphoria", rev = "514e7058e438e7bc1ad79bfcc5aa35217866641e", default-features = false }
rusqlite = { version = "0.42.0", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/lvndry/dubplate"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = true

# For running the app while developing: optimised like a release, so audio and analysis run at
# full speed, but without link-time optimisation and built in parallel and incrementally, so a
# rebuild after a small change takes seconds. Releases keep `release`.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
